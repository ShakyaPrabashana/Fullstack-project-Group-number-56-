 # ---------------------------------------------------------------------------
  # Frontend: 21 tests, then a production build. Brief M4.
  # ---------------------------------------------------------------------------
   frontend:
    name: Frontend · test and build
    runs-on: ${{ vars.RUNNER_LABEL || 'dev_runner' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: fails loudly if package-lock.json is out of step with
      # package.json rather than quietly resolving something different.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build for production
        run: npm run build

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error
