 # ---------------------------------------------------------------------------
  # Frontend: 21 tests, then a production build. Brief M4.
  # ---------------------------------------------------------------------------
   frontend:
    name: Frontend · test and build
    runs-on: ${{ vars.RUNNER_LABEL || 'dev_runner' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: fails loudly if package-lock.json is out of step with
      # package.json rather than quietly resolving something different.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build for production
        run: npm run build

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error
# ---------------------------------------------------------------------------
  # Which tiers exist yet? The backend is still an empty folder, so its job has
  # to be skipped rather than fail on a missing package.json.
  # ---------------------------------------------------------------------------
  detect:
    name: Detect tiers
    runs-on: ${{ vars.RUNNER_LABEL || 'dev_runner' }}
    outputs:
      backend: ${{ steps.check.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Look for a backend package
        shell: bash
        run: |
          if [ -f backend/package.json ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "Backend found — its job will run."
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend skipped::backend/package.json does not exist yet."
          fi

  # ---------------------------------------------------------------------------
  # Backend: skipped until the tier exists. Mongo runs as a service container so
  # Supertest has a real database to hit. Brief M2, M3, M4.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend · test
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'dev_runner' }}
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017/campusbook_test
      JWT_SECRET: ci-only-not-a-real-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
