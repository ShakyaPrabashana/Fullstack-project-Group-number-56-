name: CI/CD

# Runs on the branches the team actually works on, plus PRs into main.
on:
  push:
    branches: [main, dev_frontend, dev_backend]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Which tiers exist yet? The backend is still an empty folder, so its job has
  # to be skipped rather than fail on a missing package.json.
  # ---------------------------------------------------------------------------
  detect:
    name: Detect tiers
    runs-on: ${{ vars.RUNNER_LABEL || 'dev-runner' }}
    outputs:
      backend: ${{ steps.check.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Look for a backend package
        shell: bash
        run: |
          if [ -f backend/package.json ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "Backend found — its job will run."
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend skipped::backend/package.json does not exist yet."
          fi

  # ---------------------------------------------------------------------------
  # Frontend: Jest + React Testing Library, then a production build. Brief M4.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend · test and build
    runs-on: ${{ vars.RUNNER_LABEL || 'dev-runner' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: fails loudly if package-lock.json is out of step with
      # package.json rather than quietly resolving something different.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build for production
        run: npm run build

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Backend: Jest + Supertest. Mongo runs as a service container so the API tests
  # have a real database; the realtime tests need no database at all.
  # Brief M2, M3, M4, M5.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend · test
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'dev-runner' }}
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017/campusbook_test
      JWT_SECRET: ci-only-not-a-real-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Docker: prove the image builds and the compose file is valid. Brief M5.
  # On main it also publishes the image to this repo's container registry.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker · build image
    needs: frontend
    runs-on: ${{ vars.RUNNER_LABEL || 'dev-runner' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      # Only log in when we are actually going to push.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the owner: image references must be lowercase, GitHub usernames
      # and org names need not be.
      - id: image
        name: Work out the image name
        shell: bash
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/frontend" >> "$GITHUB_OUTPUT"

      - name: Build (and push from main)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy. Deliberately inert until someone sets the DEPLOY_ENABLED repository
  # variable, so it cannot fail the pipeline before a host has been chosen.
  #
  # To turn it on: Settings -> Secrets and variables -> Actions -> Variables,
  # add DEPLOY_ENABLED = true, then fill in the step below for your host.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'dev-runner' }}
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy the built image
        run: |
          echo "No deployment target configured yet."
          echo "Replace this step with whichever host the group picks, for example:"
          echo "  - a docker compose pull && up on a VPS over SSH"
          echo "  - Render / Railway / Fly.io deploy hook"
          echo "  - Azure Web App for Containers"
          echo "The image is already published as:"
          echo "  ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}"
          exit 1
