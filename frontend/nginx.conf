server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset filenames are safe to cache hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html must never be cached, or clients pin to an old asset manifest.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: /bookings and /login are React routes, not files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # When the Express API lands (M2), uncomment and set the service name to match
  # the backend service in docker-compose.yml.
  # location /api/ {
  #   proxy_pass http://backend:8080;
  #   proxy_http_version 1.1;
  #   proxy_set_header Upgrade $http_upgrade;      # Socket.io (M5)
  #   proxy_set_header Connection "upgrade";
  #   proxy_set_header Host $host;
  # }
}
