server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset filenames are safe to cache hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html must never be cached, or clients pin to an old asset manifest.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: /bookings and /login are React routes, not files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # "backend" is the service name in docker-compose.yml, resolved on the compose
  # network. The trailing /api/ is kept, because the Express app mounts its
  # routes under /api itself.
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # ready for Socket.io (M5)
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
